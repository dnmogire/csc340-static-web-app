<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player Details • Man United Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <span>Man United Gallery</span>
      </div>
      <nav>
        <a class="navlink" href="index.html">Home</a>
        <a class="navlink active" href="details.html">Details</a>
        <a class="navlink" href="about.html">About</a>
        <a class="navlink" href="form.html">Form</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="detail-header">
        <img id="img" src="" alt="" />
        <div>
          <h2 id="name">Player Name</h2>
          <p id="summary" style="color:var(--muted); margin-top:6px;"></p>
          <div class="actions" style="margin-top:10px;">
            <a class="btn primary" href="index.html">Back to Home</a>
            <a class="btn" href="about.html">About</a>
            <a class="btn" href="form.html">Add a player</a>
          </div>
        </div>
      </div>
    </section>

    <div class="kv" style="margin-top:14px;">
      <section class="section">
        <h3 style="margin-top:0;">Player Profile</h3>
        <dl>
          <div>
            <dt>Squad Number</dt>
            <dd>#<span id="number"></span></dd>
          </div>
          <div>
            <dt>Position</dt>
            <dd id="position"></dd>
          </div>
          <div>
            <dt>Nationality</dt>
            <dd id="nationality"></dd>
          </div>
          <div>
            <dt>Role</dt>
            <dd id="role"></dd>
          </div>
          <div>
            <dt>Strengths</dt>
            <dd id="strengths"></dd>
          </div>
          <div>
            <dt>Weakness</dt>
            <dd id="weakness"></dd>
          </div>
        </dl>
      </section>

      <section class="section">
        <h3 style="margin-top:0;">Bio</h3>
        <p id="bio" style="color:var(--muted); margin-top:0;"></p>

        <h4>Other players</h4>
        <div class="actions" id="other"></div>
      </section>
    </div>
  </main>

  <footer>
    Tip: open a player directly using <code>details.html?id=bruno-fernandes</code> (or another id).
  </footer>

  <script src="details.js"></script>
</body>
</html>
